<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CompactFS</title>
  </head>
  <body>
    <header class="toolbar">
      <button id="back" type="button" title="Voltar (Alt+←)" aria-label="Voltar" disabled>←</button>
      <button id="forward" type="button" title="Avançar (Alt+→)" aria-label="Avançar" disabled>→</button>
      <button id="up" type="button" title="Subir um nível (Backspace ou Alt+↑)" aria-label="Subir um nível" disabled>↑</button>
      <button id="refresh" type="button" title="Atualizar (F5)" aria-label="Atualizar">⟳</button>
      <nav id="crumbs" aria-label="Caminho" title="Clique num espaço vazio ou pressione Ctrl+L para digitar um caminho"></nav>
      <input id="address" class="address" type="text" role="textbox" autocomplete="off" spellcheck="false" aria-label="Endereço: digite um caminho e pressione Enter" hidden />
      <input id="search" class="search" type="text" role="searchbox" autocomplete="off" spellcheck="false" placeholder="Buscar (Ctrl+F)" aria-label="Buscar por nome nesta pasta e nas subpastas" />
      <div class="seg" role="group" aria-label="Modo de exibição">
        <button id="view-grid" type="button" aria-pressed="true" title="Galeria (miniaturas)" aria-label="Galeria"><span aria-hidden="true">▦</span><span class="seg-text" aria-hidden="true"> Galeria</span></button>
        <button id="view-list" type="button" aria-pressed="false" title="Lista (detalhes)" aria-label="Lista"><span aria-hidden="true">☰</span><span class="seg-text" aria-hidden="true"> Lista</span></button>
      </div>
      <label class="toggle"><input id="show-hidden" type="checkbox" /> Mostrar ocultos</label>
      <label class="toggle" title="Abre todos os arquivos no app padrão do sistema, sem usar o visualizador do CompactFS">
        <input id="always-default" type="checkbox" aria-label="Sempre abrir com o app padrão" />
        Sempre abrir com o app padrão
      </label>
      <div id="access-banner" class="access-banner" role="status" hidden>
        <span>Para ver todos os arquivos, o CompactFS precisa da permissão &ldquo;Acesso a todos os arquivos&rdquo;.</span>
        <button id="access-allow" type="button">Permitir acesso</button>
      </div>
    </header>

    <main id="main">
      <section id="computer" aria-label="Este computador" hidden></section>
      <section id="folder" hidden>
        <div id="search-bar" class="search-bar" hidden>
          <span id="search-info" class="search-info"></span>
          <span id="search-where" class="search-where"></span>
          <button id="search-reveal" type="button" title="Mostrar o item na pasta dele (Shift+Enter)">Mostrar na pasta</button>
          <button id="search-close" type="button" title="Limpar a busca (Esc)">✕ Limpar</button>
        </div>
        <div id="search-empty" class="search-empty" role="status" hidden></div>
        <div id="columns" class="columns" aria-hidden="true">
          <span></span><span>Nome</span><span>Modificado</span><span>Tamanho</span>
        </div>
        <div id="list" tabindex="0" role="listbox" aria-label="Arquivos e pastas" hidden>
          <div id="sizer"></div>
        </div>
        <div id="grid" tabindex="0" role="listbox" aria-label="Arquivos e pastas (galeria)" hidden>
          <div id="grid-sizer"></div>
        </div>
      </section>
      <section id="message" role="alert" hidden></section>
      <section id="viewer" class="viewer" aria-label="Visualizador" tabindex="-1" hidden>
        <header class="viewer-bar">
          <button id="viewer-close" type="button" title="Voltar à pasta (Esc)">← Voltar</button>
          <span id="viewer-title" class="viewer-title"></span>
          <span id="viewer-pos" class="viewer-pos"></span>
          <button id="viewer-prev" type="button" title="Anterior (← ou Page Up)" aria-label="Arquivo anterior">‹</button>
          <button id="viewer-next" type="button" title="Próximo (→ ou Page Down)" aria-label="Próximo arquivo">›</button>
          <button id="viewer-raw" type="button" hidden>Ver código-fonte</button>
          <button id="viewer-open" type="button" title="Abrir no app padrão do sistema">Abrir no app padrão</button>
        </header>
        <div id="viewer-body" class="viewer-body"></div>
        <footer id="viewer-note" class="viewer-note" aria-live="polite"></footer>
      </section>
    </main>

    <footer class="status">
      <span id="status-main">Iniciando…</span>
      <span id="status-app"></span>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
