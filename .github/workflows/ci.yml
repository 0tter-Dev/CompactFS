name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Actions de terceiros pinadas por SHA de commit (tag indicada no comentário).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Lê a versão do pnpm do campo packageManager do package.json (exige pnpm 11+).
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      # Sem argumentos, instala a versão e os componentes de rust-toolchain.toml.
      - name: Install Rust toolchain (pinned in rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Frontend typecheck and build
        run: pnpm build

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Release build (portable executable)
        run: pnpm tauri build --no-bundle

      - name: Report executable size
        shell: pwsh
        run: |
          $exe = Get-Item src-tauri/target/release/compactfs.exe
          "compactfs.exe: {0:N2} MiB ({1} bytes)" -f ($exe.Length / 1MB), $exe.Length | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
